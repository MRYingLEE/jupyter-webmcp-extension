<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Jupyter WebMCP Extension</title>
    <link rel="stylesheet" href="ui.css" />
  </head>
  <body class="popup">
    <h1><img src="icons/jupyter.png" alt="" />Jupyter WebMCP</h1>
    <p id="origin" class="muted"></p>
    <div id="message" class="message" hidden></div>
    <button id="toggle" type="button" hidden></button>
    <button id="reload" type="button" hidden>Reload page to enable</button>
    <ul id="status" class="status"></ul>
    <p class="muted">
      <a href="options.html" target="_blank" rel="noreferrer">Options</a>
    </p>
    <script src="popup.js"></script>
  </body>
</html>
